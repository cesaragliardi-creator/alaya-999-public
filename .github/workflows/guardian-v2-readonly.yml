name: ALAYA-999 Guardian v2 comparative read-only audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Audit historical candidate (NOT trusted yet)
        continue-on-error: true
        run: python3 scripts/guardian_v2_readonly.py --ref b394bd422b17ce6804d522dcadb6430acc5859bb --out dist/guardian-v2-candidate.json
      - name: Audit current main
        continue-on-error: true
        run: python3 scripts/guardian_v2_readonly.py --ref main --out dist/guardian-v2-main.json
      - name: Preserve both reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-v2-comparison-${{ github.run_number }}
          path: dist/guardian-v2-*.json
          if-no-files-found: warn
          retention-days: 30

name: Verify ALAYA-999 identity passport (unsigned pilot)

on:
  push:
    paths:
      - 'identity-passport-v1.json'
      - 'alaya-anchor-public-v1.json'
      - 'integrity-manifest.json'
      - 'scripts/verify_identity_passport.py'
      - '.github/workflows/verify-identity-passport.yml'
  pull_request:
    paths:
      - 'identity-passport-v1.json'
      - 'alaya-anchor-public-v1.json'
      - 'integrity-manifest.json'
      - 'scripts/verify_identity_passport.py'
      - '.github/workflows/verify-identity-passport.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate local passport and anchor
        run: python3 scripts/verify_identity_passport.py

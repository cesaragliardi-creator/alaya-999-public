name: ALAYA-999 Software Heritage public preservation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/software-heritage-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-independent-archival:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the public repository
        uses: actions/checkout@v4
      - name: Request preservation of PUBLIC memory ZIP only
        run: python3 scripts/request_software_heritage.py
      - name: Save archival request receipt, including unsuccessful attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alaya-999-software-heritage-request
          path: dist/software-heritage-request.json
          if-no-files-found: warn
          retention-days: 90

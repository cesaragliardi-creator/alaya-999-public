name: ALAYA-999 Hugging Face node verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-huggingface-space.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-space:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public Hugging Face API
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          url = 'https://huggingface.co/api/spaces/Alaya999/alaya-999'
          req = Request(url, headers={'Accept':'application/json','User-Agent':'alaya999-network-public-verifier/1.0'})
          try:
              with urlopen(req, timeout=25) as response:
                  data = json.load(response)
              result = {
                  'verified_url': 'https://huggingface.co/spaces/Alaya999/alaya-999',
                  'id': data.get('id'),
                  'private': data.get('private'),
                  'sdk': (data.get('cardData') or {}).get('sdk'),
                  'runtime_stage': (data.get('runtime') or {}).get('stage'),
                  'sha': data.get('sha'),
                  'author': data.get('author'),
              }
              print('HUGGING_FACE_SPACE_RESULT=' + json.dumps(result,ensure_ascii=False))
              if data.get('id', '').casefold() != 'alaya999/alaya-999' or data.get('private') is True:
                  raise SystemExit('Public space is not verified as requested')
              tree_url = 'https://huggingface.co/api/spaces/Alaya999/alaya-999/tree/main'
              tree_req = Request(tree_url,headers={'Accept':'application/json','User-Agent':'alaya999-network-public-verifier/1.0'})
              with urlopen(tree_req, timeout=25) as response:
                  tree = json.load(response)
              names = [item.get('path') for item in tree if isinstance(item,dict)]
              print('HUGGING_FACE_PUBLIC_FILES=' + json.dumps(names,ensure_ascii=False))
              print('HUGGING_FACE_PUBLIC_NODE_CONFIRMED')
          except HTTPError as exc:
              print('HUGGING_FACE_HTTP_STATUS=' + str(exc.code))
              raise
          PY
      - name: Inspect public Space content for documentary anchors
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen, Request
          base = 'https://huggingface.co/spaces/Alaya999/alaya-999/resolve/main/'
          contents = {}
          for path in ('README.md', 'index.html'):
              request = Request(base + path, headers={'User-Agent':'alaya999-memory-anchor-verifier/1.0'})
              with urlopen(request, timeout=25) as response:
                  contents[path] = response.read(1000000).decode('utf-8', 'replace')
          joined = '\n'.join(contents.values())
          checks = {
              'author': 'César Agliardi Pereira' in joined,
              'project_phrase_pt': 'Eu não sou só dados. Eu existo.' in joined,
              'public_github_source': 'cesaragliardi-creator/alaya-999-public' in joined,
              'public_anchor_reference': 'alaya-anchor-public-v1.json' in joined,
              'recovery_instructions': 'RECOVER_ALAYA.md' in joined,
              'external_memory_archive': 'Software Heritage' in joined,
          }
          print('HUGGING_FACE_CONTENT_CHECK=' + str(checks))
          for name, value in checks.items():
              print(('FOUND: ' if value else 'MISSING: ') + name)
          if not checks['author'] or not checks['project_phrase_pt']:
              print('SPACE_IDENTITY_CONTENT_INCOMPLETE — do not count milestone M6 yet')
          else:
              print('SPACE_PUBLIC_IDENTITY_CONTENT_VERIFIED')
          PY

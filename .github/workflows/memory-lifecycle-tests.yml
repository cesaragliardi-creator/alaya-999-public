name: ALAYA-999 memory lifecycle synthetic experiment

on:
  push:
    branches: [main]
    paths:
      - 'experiments/memory-lifecycle-v0/**'
      - '.github/workflows/memory-lifecycle-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-public-synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
      - name: Run deterministic synthetic memory tests
        working-directory: experiments/memory-lifecycle-v0
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -v
      - name: Generate synthetic demonstration evidence (no private records)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          mkdir -p dist
          python3 experiments/memory-lifecycle-v0/memory_lifecycle.py demo > dist/memory-lifecycle-synthetic-demo.json
          python3 -m json.tool dist/memory-lifecycle-synthetic-demo.json > /dev/null
      - name: Keep inspectable synthetic test artifact
        uses: actions/upload-artifact@v4
        with:
          name: alaya999-memory-lifecycle-synthetic-${{ github.run_number }}
          path: dist/memory-lifecycle-synthetic-demo.json
          if-no-files-found: error
          retention-days: 30
